name: Android Build

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Diagnose Back Navigation instrumentation test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set +e
            gradle --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yhyyzray388.invoiceapp.MainActivityBackNavigationTest --stacktrace --info
            test_status=$?
            echo '--- INSTALLED INSTRUMENTATIONS ---'
            adb shell pm list instrumentation
            echo '--- DIRECT INSTRUMENTATION RUN ---'
            adb shell am instrument -w -r -e class com.yhyyzray388.invoiceapp.MainActivityBackNavigationTest com.yhyyzray388.invoiceapp.test/androidx.test.runner.AndroidJUnitRunner
            echo '--- DEVICE LOGCAT (TEST/JUNIT ERRORS) ---'
            adb logcat -d -v threadtime | grep -E 'AndroidJUnitRunner|AndroidJUnit4ClassRunner|MainActivityBackNavigationTest|JUnit|FATAL EXCEPTION|Caused by|NoClassDefFoundError|ClassNotFoundException|ExceptionInInitializerError|InvalidTestClassError' | tail -n 500
            echo '--- TEST REPORT FILES ---'
            find app/build/outputs/androidTest-results app/build/reports/androidTests -type f 2>/dev/null | sort | tail -n 50
            exit $test_status
